function updateBrand(){
 const company=space==='empresa';
 document.body.classList.toggle('company-mode',company);
 document.body.classList.toggle('personal-mode',!company);
 document.getElementById('brandArea').innerHTML=company?`<img class="brand-logo" src="${BETUNCITA_VERTICAL}" alt="BETUNCITA - El privilegio de sorprender"><small>Finanzas empresariales · PYG</small>`:'◈ Mi Control Financiero<small>Espacio personal · PYG</small>';
 const b=document.getElementById('companyBanner');
 b.style.display=company?'flex':'none';
 b.className='company-banner';

function render(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="nav ${screen===p[0]?'active':''}" onclick="go('${p[0]}')">${p[1]} &nbsp;${p[2]}</button>`).join('');document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.id===space));document.getElementById('heading').textContent=pages.find(p=>p[0]===screen)[2];document.getElementById('subtitle').textContent=(space==='personal'?'Espacio personal privado':'Espacio de la empresa')+' · Datos de demostración local';document.getElementById('view').innerHTML=({inicio:home,movimientos:movements,captura:capture,voz:voiceScreen,cuentas:accounts,pendientes:pending,reportes:reports,catalogo:catalogScreen,cotizaciones:quotesScreen,admin:admin})[screen]();updateBrand();}
function stat(label,val,sub,cls=''){return `<div class="card"><div class="muted">${label}</div><div class="value ${cls}">${money(val)}</div><small>${sub}</small></div>`}
function table(r){return `<div class="scroll"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Tipo</th><th>Cuenta</th><th>Importe</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td><span class="pill">${esc(x.type)}</span></td><td>${esc(x.account)}</td><td class="${x.type==='Ingreso'?'positive':x.type==='Egreso'?'negative':''}">${x.type==='Egreso'?'−':x.type==='Ingreso'?'+':''}${money(x.amount)}</td></tr>`).join('')}</tbody></table>${r.length?'':'<div class="empty">Todavía no hay movimientos en este espacio.</div>'}</div>`}
function home(){let t=totals(),r=rows().slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="cards">${stat('Ingresos registrados',t.income,'No incluye transferencias','positive')}${stat('Egresos registrados',t.expense,'No incluye transferencias','negative')}${stat('Balance de movimientos',t.income-t.expense,'No equivale al saldo disponible')}${stat('Transferencias',t.transfer,'No suman ingresos ni egresos')}</div><div class="grid"><div class="panel"><h2>Últimos movimientos</h2>${table(r.slice(0,7))}<button class="btn alt" onclick="go('movimientos')">Ver todos</button></div><div class="panel"><h2>Comenzá acá</h2><p>Registrá una operación o cargá un comprobante para organizar tus finanzas.</p><button class="btn" onclick="go('captura')">+ Cargar comprobante</button> <button class="btn alt" onclick="go('voz')">🎙 Registrar por voz</button><p class="muted">${space==='personal'?'Los movimientos iniciales provienen de tu Excel.':'La empresa comienza sin movimientos importados.'}</p><div class="note">Los datos que agregues se guardan solo en este navegador. No se sincronizan con otros dispositivos.</div></div></div>`}
function movements(){let r=rows().slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="toolbar"><input id="search" placeholder="Buscar descripción o categoría" oninput="filterTable()"><select id="typeFilter" onchange="filterTable()"><option value="">Todos los tipos</option><option>Ingreso</option><option>Egreso</option><option>Transferencia</option></select><button class="btn" onclick="showForm()">+ Nuevo movimiento</button></div><div id="movetable">${table(r)}</div></div><div id="formarea"></div>`}
function filterTable(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('typeFilter').value;document.getElementById('movetable').innerHTML=table(rows().filter(x=>(!t||x.type===t)&&[x.description,x.category,x.account].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)))}
function showForm(){document.getElementById('formarea').innerHTML=`<div class="panel"><h2>Registrar movimiento</h2><form class="formgrid" onsubmit="addMove(event)"><label class="field">Fecha<input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Tipo<select name="type"><option>Ingreso</option><option>Egreso</option><option>Transferencia</option></select></label><label class="field">Importe (PYG)<input name="amount" type="number" min="1" step="1" required></label><label class="field">Categoría<input name="category" required placeholder="Ej. Supermercado"></label><label class="field">Cuenta<input name="account" required placeholder="Ej. Efectivo"></label><label class="field">Actividad empresarial (opcional)<input name="activity" placeholder="Ej. Servicios"></label><label class="field wide">Descripción<input name="description" required placeholder="¿Qué operación realizaste?"></label><div><button class="btn" type="submit">Guardar movimiento</button></div></form></div>`;document.getElementById('formarea').scrollIntoView({behavior:'smooth'})}
function addMove(e){e.preventDefault();let f=new FormData(e.target);data.items.push({id:'local-'+Date.now(),date:f.get('date'),type:f.get('type'),amount:Number(f.get('amount')),category:f.get('category'),account:f.get('account'),activity:f.get('activity'),description:f.get('description'),space,source:'Registro manual'});save();render();alert('Movimiento guardado en este navegador.')}
function capture(){return `<div class="panel"><h2>Captura inteligente de comprobantes</h2><div class="note">En este prototipo podés seleccionar y visualizar una imagen, pero todavía no se realiza lectura con IA. Para evitar errores, los datos se ingresan manualmente y se guardan como movimiento.</div><div class="upload"><div style="font-size:35px">▣</div><p>Seleccioná una foto del ticket o factura</p><input type="file" accept="image/*" onchange="previewFile(event)"><div id="filePreview"></div></div><p>Después de revisar la imagen, registrá los datos de la operación.</p><button class="btn" onclick="go('movimientos');showForm()">Registrar datos del comprobante</button></div>`}
function previewFile(e){let f=e.target.files[0],el=document.getElementById('filePreview');if(!f)return;let url=URL.createObjectURL(f);el.innerHTML=`<img class="preview" src="${url}" alt="Comprobante seleccionado"><p class="muted">Vista previa temporal. El archivo no se almacena.</p>`}
function accounts(){return `<div class="panel"><h2>Cuentas y saldos</h2>${space==='personal'?`<div class="note">Saldos informados en el Excel al 07/11/2026. No se recalculan automáticamente con los movimientos posteriores.</div><div class="cards" style="margin-top:16px">${data.accounts.map(a=>stat(esc(a.name),a.balance,'Saldo informado')).join('')}</div>`:'<div class="empty">Todavía no hay cuentas empresariales configuradas.</div>'}</div>`}
function pending(){return `<div class="panel"><h2>Cobros y pagos pendientes</h2><div class="note">Esta pantalla está preparada para la siguiente etapa. Los compromisos de tu Excel requieren revisión antes de convertirlos en cuentas por pagar, para evitar duplicar pagos ya registrados.</div></div>`}
function reports(){let t=totals(),r=rows(),groups={};r.filter(x=>x.type==='Egreso').forEach(x=>groups[x.category]=(groups[x.category]||0)+Number(x.amount));let a=Object.entries(groups).sort((x,y)=>y[1]-x[1]);return `<div class="cards">${stat('Ingresos',t.income,'Movimientos importados y nuevos')}${stat('Egresos',t.expense,'Movimientos importados y nuevos')}${stat('Balance',t.income-t.expense,'Ingresos menos egresos')}${stat('Transferencias',t.transfer,'Excluidas del balance')}</div><div class="panel"><h2>Gastos por categoría</h2>${a.map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar"><span style="width:${t.expense?100*v/t.expense:0}%"></span></div>`).join('')||'<div class="empty">Sin gastos registrados.</div>'}</div><div class="panel"><button class="btn alt" onclick="exportCSV()">Exportar movimientos a CSV</button></div>`}
function exportCSV(){let cols=['date','type','category','description','account','amount','currency','space','source'];let csv='\ufeff'+[cols.join(';'),...data.items.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='movimientos_control_financiero.csv';a.click();URL.revokeObjectURL(a.href)}
function admin(){return `<div class="panel"><h2>Estado del prototipo</h2><p>Espacios: Personal y Empresa · Moneda: PYG · Actividad empresarial: mixta.</p><div class="note">Esta demostración no incluye inicio de sesión ni permisos reales. No la utilices como sistema multiusuario hasta incorporar autenticación, base de datos y políticas de acceso.</div><h2 style="margin-top:24px">Presupuestos y referencias del Excel</h2>${space==='personal'?`<div class="scroll"><table><thead><tr><th>Concepto</th><th>Estado</th><th>Referencia mensual</th></tr></thead><tbody>${data.budgets.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.status)}</td><td>${b.amount?money(b.amount):'Por confirmar'}</td></tr>`).join('')}</tbody></table></div>`:'<p>Configuración empresarial pendiente de completar.</p>'}<h2 style="margin-top:24px">Datos de prueba</h2><p class="muted">Podés restaurar el conjunto original del Excel; esto eliminará los movimientos agregados en este navegador.</p><button class="btn danger" onclick="resetData()">Restaurar datos iniciales</button></div>`}
function resetData(){if(confirm('¿Eliminar los movimientos añadidos en este navegador y restaurar los datos originales?')){data=JSON.parse(JSON.stringify(seed));save();render()}}

let recognition=null, audioRecorder=null, audioStream=null, audioChunks=[], audioBlob=null, audioUrl=null;
function voiceScreen(){return `<div class="panel"><h2>🎙 Registrar movimiento hablando</h2><p class="note">Grabá tu gasto o ingreso con un solo botón. El audio se transcribe y se abre un formulario para revisar los datos antes de guardarlos. Requiere que la aplicación esté publicada con HTTPS y tenga configurado el servicio de transcripción.</p><div class="toolbar"><button class="btn" type="button" id="voiceOneButton" onclick="toggleSmartVoice()">🎙 Grabar movimiento</button><span id="voiceStatus" role="status" aria-live="polite">Listo para grabar</span></div><div id="audioPlayback" style="display:none"></div><label class="field">Texto reconocido (podés corregirlo)<textarea id="voiceText" rows="3" placeholder="Aquí aparecerá lo que dijiste"></textarea></label><button class="btn alt" type="button" onclick="analyzeVoice()">Revisar texto</button><div id="voiceReview"></div><p class="muted" style="margin-top:12px">Ejemplo: «Gasté 150 mil guaraníes en supermercado, en efectivo». Los audios se envían al servidor para transcripción, pero no se guardan en el servidor de esta aplicación. Los movimientos confirmados se guardan en este navegador.</p></div>`}
let smartVoiceBusy=false;
async function toggleSmartVoice(){
 if(smartVoiceBusy)return;
 if(audioRecorder&&audioRecorder.state==='recording'){document.getElementById('voiceOneButton').disabled=true;audioRecorder.stop();voiceMessage('Transcribiendo tu audio…');return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){voiceMessage('Necesitás abrir la aplicación desde HTTPS y permitir el micrófono.');return}
 try{
 audioStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];
 const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
 audioRecorder=new MediaRecorder(audioStream,mime?{mimeType:mime}:undefined);
 audioRecorder.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data)};
 audioRecorder.onstop=async()=>{
  const btn=document.getElementById('voiceOneButton');releaseAudioStream();
  const blob=new Blob(audioChunks,{type:audioRecorder.mimeType||'audio/webm'});
  if(!blob.size){voiceMessage('No se capturó audio. Intentá otra vez.');if(btn){btn.disabled=false;btn.textContent='🎙 Grabar movimiento'}return}
  smartVoiceBusy=true;
  try{
   const fd=new FormData();fd.append('audio',blob,blob.type.includes('mp4')?'voz.m4a':'voz.webm');
   const response=await fetch('/api/transcribir',{method:'POST',body:fd});
   const result=await response.json().catch(()=>({error:'Respuesta inválida del servidor'}));
   if(!response.ok)throw new Error(result.detail||result.error||'No se pudo transcribir');
   const text=(result.text||'').trim();if(!text)throw new Error('No se reconocieron palabras');
   document.getElementById('voiceText').value=text;
   voiceMessage('Audio transcrito. Revisá los datos antes de guardar.');
   analyzeVoice();
  }catch(e){voiceMessage('No se pudo procesar el audio: '+e.message)}
  finally{smartVoiceBusy=false;if(btn){btn.disabled=false;btn.textContent='🎙 Grabar movimiento'}}
 };
 audioRecorder.onerror=()=>{releaseAudioStream();voiceMessage('Error al grabar audio');const btn=document.getElementById('voiceOneButton');if(btn){btn.disabled=false;btn.textContent='🎙 Grabar movimiento'}};
 audioRecorder.start();document.getElementById('voiceOneButton').textContent='■ Detener y procesar';voiceMessage('Grabando… decí el movimiento y tocá Detener.');
 }catch(e){releaseAudioStream();voiceMessage('No se pudo acceder al micrófono: '+e.message)}
}

function voiceMessage(msg){let el=document.getElementById('voiceStatus');if(el)el.textContent=msg}
function releaseAudioStream(){if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null}}
async function recordAudio(){
 if(audioRecorder&&audioRecorder.state==='recording'){voiceMessage('Ya se está grabando. Tocá Detener.');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){voiceMessage('Este navegador o la forma de abrir el archivo no permite grabar directamente. Probá «Grabar o elegir audio» o abrí la aplicación mediante HTTPS.');return}
 try{
  audioStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];
  let types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];let mime=types.find(x=>MediaRecorder.isTypeSupported(x));
  audioRecorder=new MediaRecorder(audioStream,mime?{mimeType:mime}:undefined);
  audioRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data)};
  audioRecorder.onstop=()=>{let type=audioRecorder.mimeType||'audio/webm';let blob=new Blob(audioChunks,{type});releaseAudioStream();if(blob.size){setAudioBlob(blob);voiceMessage('Audio grabado. Podés escucharlo o descargarlo.')}else voiceMessage('No se capturó audio. Intentá de nuevo.')};
  audioRecorder.onerror=()=>{releaseAudioStream();voiceMessage('Error de grabación. Probá «Grabar o elegir audio».')};
  audioRecorder.start();voiceMessage('🔴 Grabando audio… tocá Detener para finalizar.');
 }catch(e){releaseAudioStream();voiceMessage(e.name==='NotAllowedError'?'Permiso de micrófono denegado. Habilitalo en el navegador o usá «Grabar o elegir audio».':e.name==='NotFoundError'?'No se encontró un micrófono.':'No se pudo abrir el micrófono ('+e.name+'). Si abriste el HTML desde Descargas, probá la opción de elegir audio o una página HTTPS.')}
}
function setAudioBlob(blob){if(audioUrl)URL.revokeObjectURL(audioUrl);audioBlob=blob;audioUrl=URL.createObjectURL(blob);let type=blob.type||'';let ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':type.includes('mpeg')?'mp3':'webm';let el=document.getElementById('audioPlayback');if(el)el.innerHTML=`<div class="panel" style="margin:0"><b>🎧 Tu audio (${Math.round(blob.size/1024)} KB)</b><div style="margin-top:10px"><audio controls src="${audioUrl}" style="width:100%"></audio></div><div class="toolbar" style="margin-top:10px"><a class="btn alt" href="${audioUrl}" download="nota-financiera-${Date.now()}.${ext}">⬇ Descargar audio</a></div></div>`}
function loadAudioFile(e){let f=e.target.files&&e.target.files[0];if(!f)return;setAudioBlob(f);voiceMessage('Audio seleccionado. Podés escucharlo o descargarlo. Para registrar el movimiento, completá el texto o usá el dictado en vivo.')}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){voiceMessage('Este navegador no admite transcripción automática. Tocá el micrófono del teclado Android dentro del campo de texto, dictá el gasto y después «Analizar y revisar movimiento». La grabación de audio por sí sola no puede convertirse a texto sin un servicio de transcripción.');let t=document.getElementById('voiceText');if(t)t.focus();return}
 if(recognition){try{recognition.abort()}catch(e){}}
 recognition=new SR();recognition.lang='es-PY';recognition.interimResults=false;recognition.continuous=false;
 recognition.onresult=e=>{let t=Array.from(e.results).map(x=>x[0].transcript).join(' ').trim();let el=document.getElementById('voiceText');if(el&&t){el.value=(el.value+' '+t).trim();voiceMessage('Dictado recibido. Revisá el movimiento y confirmá para guardarlo.');analyzeVoice()}else voiceMessage('No se reconocieron palabras. Volvé a intentar.')};
 recognition.onerror=e=>voiceMessage('El navegador no pudo transcribir ('+e.error+'). Podés usar el micrófono del teclado de Android dentro del campo de texto y después tocar «Analizar y revisar movimiento».');
 recognition.onend=()=>{recognition=null};
 try{recognition.start();voiceMessage('🎙 Escuchando… decí, por ejemplo: «Gasté 150 mil guaraníes en supermercado en efectivo».')}catch(e){voiceMessage('No se pudo iniciar el dictado ('+e.name+'). Probá el micrófono del teclado Android.')}
}
function stopVoice(){if(audioRecorder&&audioRecorder.state==='recording'){audioRecorder.stop();voiceMessage('Procesando audio…')}if(recognition){try{recognition.stop()}catch(e){}recognition=null}}
function clearVoice(){stopVoice();let t=document.getElementById('voiceText'),r=document.getElementById('voiceReview'),a=document.getElementById('audioPlayback');if(t)t.value='';if(r)r.innerHTML='';if(a)a.innerHTML='';if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=null;audioBlob=null;voiceMessage('Listo para grabar')}
function amountFromSpeech(t){let normalized=t.toLowerCase().replace(/\b(gs\.?|guaran[ií]es|pyg)\b/g,' ');let m=normalized.match(/(?:\d{1,3}(?:[.\s]\d{3})+|\d+)(?:,\d+)?\s*(?:millones?|mil)?/g)||[];let candidates=m.map(x=>{let z=x.trim(),mult=/mill[oó]n/.test(z)?1000000:/\bmil\b/.test(z)?1000:1;let n=Number(z.replace(/\s*(millones?|mil)\b/,'').replace(/[.\s]/g,'').replace(',','.'));return Math.round(n*mult)}).filter(n=>Number.isFinite(n)&&n>0);if(candidates.length)return candidates[0];let words={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};let w=normalized.match(/\b(?:(?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|seiscientos|setecientos|ochocientos|novecientos)(?:\s+y)?\s*)+mil\b/);if(w){let n=w[0].replace(/\bmil\b/,'').split(/\s+/).reduce((a,x)=>a+(words[x]||0),0);return n*1000}return 0}
function guessCategory(t){if(/combustible|nafta|diesel|gasolina|estaci[oó]n de servicio/.test(t))return 'Combustible';if(/supermercado|mercader[ií]a|stock|insumos/.test(t))return 'Compras / mercadería';if(/almuerzo|cena|desayuno|comida|restaurante/.test(t))return 'Alimentación';if(/uber|bolt|taxi|pasaje|transporte/.test(t))return 'Transporte';if(/salario|sueldo/.test(t))return 'Salario';if(/servicio|trabajo|honorarios/.test(t))return 'Servicios';if(/alquiler/.test(t))return 'Alquiler';return 'Por clasificar'}
function analyzeVoice(){let raw=document.getElementById('voiceText').value.trim(),el=document.getElementById('voiceReview');if(!raw){el.innerHTML='<p class="negative">Primero dictá o escribí un movimiento.</p>';return}let t=raw.toLowerCase(),amount=amountFromSpeech(t),type=/\b(cobr[eé]|recib[ií]|ingres[oó]|vend[ií]|venta|me pagaron|depositaron)\b/.test(t)?'Ingreso':/\b(pagu[eé]|gast[eé]|compr[eé]|abon[eé]|egreso|sal[ií]da)\b/.test(t)?'Egreso':'',sp=/\b(empresa|negocio|comercial|cliente|proveedor)\b/.test(t)?'empresa':/\b(personal|casa|familia|m[ií]o)\b/.test(t)?'personal':space,account=/\b(efectivo|contado)\b/.test(t)?'Efectivo':/\b(tarjeta)\b/.test(t)?'Tarjeta':/\b(banco|transferencia|cuenta bancaria)\b/.test(t)?'Banco':'',date=new Date().toLocaleDateString('en-CA');if(/\bayer\b/.test(t)){let d=new Date();d.setDate(d.getDate()-1);date=d.toLocaleDateString('en-CA')}let options=(vals,v)=>vals.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');el.innerHTML=`<div class="panel"><h2>Revisá el movimiento antes de guardar</h2><div class="note">Las sugerencias se obtienen mediante reglas básicas de texto, no mediante IA conectada. Completá los campos faltantes y corregí cualquier dato. No se guarda nada hasta que confirmes.</div><form class="formgrid" onsubmit="saveVoice(event)"><label class="field">Fecha<input type="date" name="date" required value="${date}"></label><label class="field">Espacio<select name="space">${options(['personal','empresa'],sp)}</select></label><label class="field">Tipo<select name="type" required><option value="">Seleccionar tipo</option>${options(['Ingreso','Egreso','Transferencia'],type)}</select></label><label class="field">Importe (PYG)<input type="number" min="1" step="1" name="amount" value="${amount||''}" required placeholder="Importe exacto"></label><label class="field">Categoría<input name="category" required value="${esc(guessCategory(t))}"></label><label class="field">Cuenta o medio de pago<input name="account" required value="${esc(account)}" placeholder="Ej. Efectivo, Banco, Tarjeta"></label><label class="field wide">Descripción<input name="description" required value="${esc(raw)}"></label><label class="field">Fecha de comprobante<select name="receipt"><option value="pendiente">Sin comprobante / pendiente</option><option value="no_aplica">No aplica</option></select></label><div class="wide"><button class="btn" type="submit">✓ Confirmar y guardar movimiento</button></div></form></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function saveVoice(e){e.preventDefault();let f=new FormData(e.target);let item={id:'voz-'+Date.now(),date:f.get('date'),space:f.get('space'),type:f.get('type'),amount:Number(f.get('amount')),category:f.get('category').trim(),account:f.get('account').trim(),description:f.get('description').trim(),receipt:f.get('receipt'),currency:'PYG',status:'Pagado',source:'Dictado revisado'};if(!item.type||!item.amount||!item.account){alert('Completá tipo, importe y cuenta.');return}data.items.push(item);save();space=item.space;go('movimientos');alert('Movimiento confirmado y guardado localmente. Podés adjuntar el comprobante en una versión futura.')}

function quoteFormData(){let f=document.getElementById('quoteForm');if(!f.reportValidity())return null;let a=new FormData(f),qty=Number(a.get('qty')),price=Number(a.get('price')),percent=Number(a.get('percent'));if(!Number.isInteger(qty)||qty<1||!Number.isFinite(price)||price<=0||percent<0||percent>100)return null;let total=qty*price;return {client:String(a.get('client')).trim(),phone:String(a.get('phone')).trim(),kind:a.get('kind'),percent,productCode:String(a.get('productCode')||''),product:String(a.get('product')).trim(),qty,price,total,deposit:Math.round(total*percent/100),valid:a.get('valid'),delivery:a.get('delivery'),details:String(a.get('details')).trim(),terms:String(a.get('terms')).trim()}}

function calcQuote(){let f=document.getElementById('quoteForm');if(!f)return;let qty=Math.max(0,Number(f.elements.qty.value)||0),price=Math.max(0,Number(f.elements.price.value)||0),pct=Math.min(100,Math.max(0,Number(f.elements.percent.value)||0)),total=qty*price,deposit=Math.round(total*pct/100);document.getElementById('quoteCalc').innerHTML=`<b>Resumen de cotización</b><p>Total: <strong>${money(total)}</strong></p><p>Anticipo (${pct}%): <strong>${money(deposit)}</strong></p><p>Saldo restante: <strong>${money(total-deposit)}</strong></p>`}

 return `<div class="panel"><div class="toolbar"><h2 style="margin:0;flex:1">✦ Catálogo inteligente · BETUNCITA</h2><button class="btn" onclick="newProduct()">+ Nuevo producto</button></div><div class="note">Los precios y costos son internos. La descripción comercial se usa en la cotización; los costos nunca se incluyen en el PDF. Los componentes de CAJ-001 son ejemplos y sus costos están pendientes de completar.</div><div class="scroll"><table><thead><tr><th>Código</th><th>Producto</th><th>Precio</th><th>Costo estimado</th><th>Margen bruto estimado</th><th>Acciones</th></tr></thead><tbody>${list||'<tr><td colspan="6">Todavía no hay productos.</td></tr>'}</tbody></table></div></div><div id="productEditor"></div>`;

const HELPERS_KEY='betuncita_ayudantes_v1', ORDERS_KEY='betuncita_ordenes_produccion_v1';

 if(space!=='empresa')return `<div class="panel"><h2>Producción y equipo</h2><p>Disponible en el espacio Empresa.</p><button class="btn" onclick="setSpace('empresa')">Ir a Empresa</button></div>`;

 const options=quotes.filter(q=>!productionOrders.some(o=>o.quoteId===q.id)).map(q=>`<option value="${esc(q.id)}">${esc(q.number)} · ${esc(q.client)} · ${esc(q.product)}</option>`).join('');
 const orders=productionOrders.slice().reverse().map(o=>{let done=(o.tasks||[]).filter(t=>t.done).length,all=(o.tasks||[]).length,h=helpers.find(h=>h.id===o.helperId),q=quotes.find(q=>q.id===o.quoteId);return `<div class="panel"><div class="toolbar"><h2 style="margin:0;flex:1">${esc(o.number)} · ${esc(o.product)}</h2><span class="muted">${esc(o.status)}</span></div><p><b>Cliente:</b> ${esc(o.client)} · <b>Colaborador:</b> ${esc(h?h.name:'Sin asignar')}<br><b>Entrega:</b> ${esc(o.delivery||'Por definir')} · <b>Avance:</b> ${done}/${all}</p><div class="note">${esc(o.details||'Sin instrucciones especiales')}</div><div style="display:grid;gap:10px;margin:12px 0">${(o.tasks||[]).map((t,i)=>`<label style="display:flex;align-items:center;gap:9px"><input type="checkbox" ${t.done?'checked':''} onchange="toggleProductionTask('${esc(o.id)}',${i},this.checked)"> ${esc(t.label)}</label>`).join('')}</div><div class="formgrid"><label class="field">Responsable<select onchange="updateOrder('${esc(o.id)}','helperId',this.value)"><option value="">Sin asignar</option>${helpers.map(h=>`<option value="${esc(h.id)}" ${o.helperId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label><label class="field">Pago acordado por pedido (Gs.)<input type="number" min="0" step="1" value="${Number(o.helperFee)||0}" onchange="updateOrder('${esc(o.id)}','helperFee',this.value)"></label><label class="field">Estado<select onchange="updateOrder('${esc(o.id)}','status',this.value)">${['Pendiente','En preparación','Listo','Entregado'].map(v=>`<option ${o.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Pago al ayudante<select onchange="updateOrder('${esc(o.id)}','payment',this.value)"><option ${o.payment==='Pendiente'?'selected':''}>Pendiente</option><option ${o.payment==='Pagado'?'selected':''}>Pagado</option></select></label></div><p><b>Pago por trabajo:</b> ${money(o.helperFee)} · <b>Estado de pago:</b> ${esc(o.payment)} ${q?'· <b>Venta cotizada:</b> '+money(q.total):''}</p><div class="toolbar" style="margin-top:16px"><button class="btn" onclick="printProductionSheet('${esc(o.id)}')">🖨 Ficha de producción / Guardar PDF</button></div><small class="muted">El pago acordado se considera costo estimado de producción. Marcarlo como pagado NO crea un movimiento financiero: registrá el egreso por separado en Movimientos.</small></div>`}).join('');
 return `<div class="panel"><h2>✦ Producción y equipo · BETUNCITA</h2><div class="note">Ayudantes ocasionales · pago acordado por pedido terminado. Los pagos y las tareas se guardan localmente. No hay acceso remoto ni cuentas individuales en este prototipo.</div><h3>Colaboradores</h3><form class="formgrid" onsubmit="addHelper(event)"><label class="field">Nombre<input name="name" required placeholder="Nombre del ayudante"></label><label class="field">Teléfono<input name="phone" placeholder="09..."></label><label class="field wide">Especialidad / tareas habituales<input name="specialty" placeholder="Armado, decoración, personalización..."></label><div class="wide"><button class="btn" type="submit">+ Agregar colaborador</button></div></form><div class="scroll"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Especialidad</th><th>Acciones</th></tr></thead><tbody>${helperRows||'<tr><td colspan="4">Aún no hay colaboradores registrados.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Crear orden desde una cotización guardada</h2><form class="formgrid" onsubmit="createProductionOrder(event)"><label class="field wide">Cotización<select name="quoteId" required><option value="">Seleccionar cotización</option>${options}</select></label><label class="field">Asignar colaborador<select name="helperId"><option value="">Sin asignar</option>${helpers.map(h=>`<option value="${esc(h.id)}">${esc(h.name)}</option>`).join('')}</select></label><label class="field">Pago acordado por pedido (Gs.)<input name="fee" type="number" min="0" step="1" value="0" required></label><div class="wide"><button class="btn" type="submit" ${options?'':'disabled'}>Crear orden de producción</button></div></form><p class="muted">La lista de preparación se genera con los componentes del producto y se puede completar con tareas especiales.</p></div><div class="panel"><h2>Órdenes de producción</h2><p class="muted">${productionOrders.length} orden(es) · Pago total acordado: ${money(productionOrders.reduce((a,o)=>a+orderCost(o),0))} · Pendiente de pagar: ${money(productionOrders.filter(o=>o.payment!=='Pagado').reduce((a,o)=>a+orderCost(o),0))}</p></div>${orders||'<div class="panel">Todavía no hay órdenes. Guardá una cotización y convertíla en orden de producción.</div>'}`;

function addHelper(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;helpers.push({id:'h'+Date.now(),name,phone:String(f.get('phone')||''),specialty:String(f.get('specialty')||'')});saveProduction();render()}

function deleteHelper(id){if(productionOrders.some(o=>o.helperId===id)){alert('Este colaborador está asignado a órdenes. Reasigná esos pedidos antes de quitarlo.');return}if(!confirm('¿Quitar este colaborador?'))return;helpers=helpers.filter(h=>h.id!==id);saveProduction();render()}
function createProductionOrder(e){e.preventDefault();let f=new FormData(e.target),q=quotes.find(x=>x.id===f.get('quoteId'));if(!q)return;let p=products.find(x=>x.code===q.productCode),components=(p?.components||[]).filter(c=>c.name).map(c=>({label:`${c.name} · ${c.qty} ${c.unit}`,done:false}));let tasks=[...components,{label:'Revisar personalización y dedicatoria',done:false},{label:'Control final de calidad y empaque',done:false}];let o={id:'op'+Date.now(),number:'OP-'+String(productionOrders.length+1).padStart(4,'0'),quoteId:q.id,client:q.client,product:q.product,productCode:q.productCode||'',delivery:q.delivery||'',details:q.details||'',helperId:String(f.get('helperId')||''),helperFee:Math.max(0,Number(f.get('fee'))||0),payment:'Pendiente',status:'Pendiente',tasks};productionOrders.push(o);saveProduction();render();alert('Orden '+o.number+' creada.')}
function toggleProductionTask(id,index,done){let o=productionOrders.find(x=>x.id===id);if(!o||!o.tasks[index])return;o.tasks[index].done=done;saveProduction();render()}
function updateOrder(id,key,value){let o=productionOrders.find(x=>x.id===id);if(!o)return;if(key==='helperFee')value=Math.max(0,Number(value)||0);o[key]=value;saveProduction();render()}
const renderBeforeProduction=render;
render=function(){if(screen==='produccion'){screen='inicio';renderBeforeProduction();screen='produccion';document.getElementById('view').innerHTML=productionScreen();document.getElementById('heading').textContent='Producción y equipo';document.querySelectorAll('.nav').forEach((b,i)=>b.classList.toggle('active',pages[i][0]==='produccion'));}else renderBeforeProduction()};

function fSetIncome(e){e.preventDefault();let f=new FormData(e.target);fam.incomePlans={yo:Number(f.get('yo')||0),marido:Number(f.get('marido')||0)};fSave();render()}
function fSetGeneral(e){e.preventDefault();let f=new FormData(e.target);fam.general=Number(f.get('general')||0);fam.savings=Number(f.get('savings')||0);fSave();render()}
function fCategories(){let entries=Object.entries(FAMILY_CATS);return `<div class="panel"><h2>Categorías del presupuesto familiar</h2><p>Los límites se mantienen mes a mes. <b>Extras y salidas</b> se controla sin presupuesto obligatorio para detectar dónde reducir gastos. <b>Ahorros</b> se gestiona aparte de los gastos de consumo.</p><div class="scroll"><table><thead><tr><th>Categoría</th><th>Gastado este mes</th><th>Límite mensual (₲)</th><th>Seguimiento</th></tr></thead><tbody>${entries.map(([c,subs])=>`<tr><td><b>${esc(c)}</b><div class="muted">${subs.map(esc).join(' · ')}</div></td><td>${money(fSpent(c))}</td><td>${c==='Extras y salidas'||c==='Ahorros y fondos especiales'?'<span class="muted">Sin límite obligatorio</span>':`<input style="width:155px" aria-label="Límite de ${esc(c)}" type="number" min="0" value="${Number(fam.limits[c])||0}" onchange="fLimit('${c}',this.value)">`}</td><td>${fBar(fSpent(c),Number(fam.limits[c])||0)}</td></tr>`).join('')}</tbody></table></div></div><div class="grid"><div class="panel"><h2>¿Dónde podemos ahorrar?</h2><p><b>Extras y salidas este mes: ${money(fSpent('Extras y salidas'))}</b></p><p class="muted">Compará este gasto con meses anteriores y revisá delivery, restaurantes y compras no esenciales. No se asigna límite automáticamente.</p><button class="btn alt" onclick="go('movimientos');showForm()">Registrar gasto familiar</button></div><div class="panel"><h2>Evitar gastos duplicados</h2><p>Registrá cada compra una sola vez. Un pago de tarjeta correspondiente a una compra ya anotada no debe volver a contarse como gasto de consumo.</p><p class="muted">En el formulario original podés usar categorías con formato «Categoría · Subcategoría».</p></div></div>`}
function fLimit(c,v){fam.limits[c]=Math.max(0,Number(v)||0);fSave();render()}
function fSuper(){let shop=fam.shopping||[],purchases=fam.purchases||[],month=fMonth(),pm=purchases.filter(p=>p.date.slice(0,7)===month),total=pm.reduce((s,p)=>s+p.qty*p.price,0);let grouped={};pm.forEach(p=>{let k=p.name.toLowerCase();if(!grouped[k])grouped[k]={name:p.name,qty:0,unit:p.unit,count:0,total:0};grouped[k].qty+=p.qty;grouped[k].count++;grouped[k].total+=p.qty*p.price});return `<div class="cards">${stat('Productos comprados',pm.length,'Registros del mes')}${stat('Total de productos',total,'Detalle de compras registrado')}${stat('En lista pendiente',shop.filter(p=>!p.done).length,'Por comprar')}${stat('Gastos del hogar',fSpent('Compras del hogar'),'Movimientos financieros del mes')}</div><div class="grid"><div class="panel"><h2>🛒 Mi lista de compras</h2><form class="formgrid" onsubmit="fAddShop(event)">${fField('Producto','<input name="name" required placeholder="Ej. Leche">')}${fField('Cantidad','<input type="number" name="qty" min="0.01" step="0.01" value="1" required>')}${fField('Unidad',`<select name="unit">${fSelect(['unidad','kg','g','litro','ml','paquete','caja'])}</select>`)}${fField('Lugar',`<select name="place">${fSelect(['Supermercado','Carnicería','Verdulería','Farmacia','Otro'])}</select>`)}<div><button class="btn">+ Agregar a la lista</button></div></form><div class="scroll"><table><thead><tr><th>Comprado</th><th>Producto</th><th>Cantidad</th><th></th></tr></thead><tbody>${shop.map(p=>`<tr><td><input type="checkbox" ${p.done?'checked':''} onchange="fToggleShop('${p.id}',this.checked)"></td><td>${esc(p.name)}</td><td>${p.qty} ${esc(p.unit)}</td><td><button class="btn alt" onclick="fRemoveShop('${p.id}')">Quitar</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Registrar productos comprados</h2><form class="formgrid" onsubmit="fAddPurchase(event)">${fField('Producto','<input name="name" required placeholder="Ej. Arroz">')}${fField('Fecha',`<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}">`)}${fField('Cantidad','<input name="qty" type="number" min="0.01" step="0.01" value="1" required>')}${fField('Unidad',`<select name="unit">${fSelect(['unidad','kg','g','litro','ml','paquete','caja'])}</select>`)}${fField('Precio por unidad (₲)','<input name="price" type="number" min="0" value="0" required>')}${fField('Comercio','<input name="store" placeholder="Nombre del comercio">')}<div><button class="btn">Guardar producto</button></div></form><div class="note">Este detalle sirve para analizar cantidades y frecuencia. Para sumar el gasto al presupuesto familiar, registrá el importe total del ticket una sola vez en Movimientos, por foto (captura) o por voz. No duplicamos automáticamente el importe de los productos.</div><div class="toolbar" style="margin-top:12px"><button class="btn alt" onclick="go('captura')">📷 Foto del ticket</button><button class="btn alt" onclick="go('voz')">🎙 Registrar por voz</button></div></div></div><div class="panel"><h2>Consumo y frecuencia de compra · ${month}</h2><div class="scroll"><table><thead><tr><th>Producto</th><th>Cantidad mensual</th><th>Veces comprado</th><th>Total</th></tr></thead><tbody>${Object.values(grouped).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty} ${esc(p.unit)}</td><td>${p.count}</td><td>${money(p.total)}</td></tr>`).join('')}</tbody></table></div><p class="muted">La frecuencia estimada y las sugerencias de reposición mejorarán a medida que registres compras de varios meses. La lectura automática de la foto del ticket todavía no está implementada.</p></div>${fNotice}`}
function fAddShop(e){e.preventDefault();let f=new FormData(e.target);fam.shopping.push({id:'s'+Date.now(),name:f.get('name'),qty:Number(f.get('qty')),unit:f.get('unit'),place:f.get('place'),done:false});fSave();render()}
function fToggleShop(id,v){let p=fam.shopping.find(x=>x.id===id);if(p)p.done=v;fSave();render()}
function fRemoveShop(id){fam.shopping=fam.shopping.filter(x=>x.id!==id);fSave();render()}
function fAddPurchase(e){e.preventDefault();let f=new FormData(e.target);fam.purchases.push({id:'p'+Date.now(),name:f.get('name'),date:f.get('date'),qty:Number(f.get('qty')),unit:f.get('unit'),price:Number(f.get('price')),store:f.get('store')});fSave();render()}
function fVehicle(){let v=fam.vehicle,oilDue=Number(v.oilLast||0)+Number(v.oilInterval||0),left=oilDue-Number(v.km||0);return `<div class="cards">${stat('Kilometraje actual',v.km,'Kia Rio 2013')}${stat('Último cambio de aceite',v.oilLast,'Kilometraje registrado')}${stat('Próximo cambio',oilDue,'Según indicación del mecánico')}${stat('Kilómetros restantes',left,'Aviso por km o fecha')}</div><div class="grid"><div class="panel"><h2>🚗 Mi vehículo: ${esc(v.name)}</h2><form class="formgrid" onsubmit="fSetVehicle(event)">${fField('Kilometraje actual','<input type="number" min="0" name="km" value="'+Number(v.km||0)+'">')}${fField('Último cambio de aceite (km)','<input type="number" min="0" name="oilLast" value="'+Number(v.oilLast||0)+'">')}${fField('Intervalo de aceite (km)','<input type="number" min="1" name="oilInterval" value="'+Number(v.oilInterval||10000)+'">')}${fField('Fecha del último cambio (opcional)',`<input type="date" name="oilDate" value="${esc(v.oilDate||'')}">`)}${fField('Próximo cambio por fecha (opcional)',`<input type="date" name="oilDueDate" value="${esc(v.oilDueDate||'')}">`)}<div><button class="btn">Guardar mantenimiento</button></div></form><p class="muted">Se usa el primer límite que corresponda: fecha o kilometraje. No inventamos la fecha que todavía no nos pasaste.</p></div><div class="panel"><h2>Gastos del vehículo</h2><p><b>${money(fSpent('Vehículo'))}</b> registrados este mes en Movimientos.</p><p>Subcategorías: combustible, cambio de aceite, mantenimiento, cubiertas, repuestos, seguro, habilitación, peajes y otros.</p><div class="toolbar"><button class="btn alt" onclick="go('movimientos');showForm()">+ Registrar gasto</button><button class="btn alt" onclick="go('vencimientos')">Ver recordatorios</button></div>${left<=0?'<div class="note">Revisá el cambio de aceite: alcanzaste el kilometraje indicado.</div>':''}</div></div>`}
function fSetVehicle(e){e.preventDefault();let f=new FormData(e.target);['km','oilLast','oilInterval'].forEach(k=>fam.vehicle[k]=Number(f.get(k)||0));['oilDate','oilDueDate'].forEach(k=>fam.vehicle[k]=f.get(k));fSave();render()}
function fDue(){let now=new Date().toISOString().slice(0,10),items=fam.due||[],v=fam.vehicle;return `<div class="grid"><div class="panel"><h2>🔔 Próximos pagos y vencimientos</h2><form class="formgrid" onsubmit="fAddDue(event)">${fField('Concepto','<input name="name" required placeholder="Ej. Cuota colegio">')}${fField('Categoría',`<select name="category">${fSelect(Object.keys(FAMILY_CATS))}</select>`)}${fField('Importe previsto (₲)','<input type="number" name="amount" min="0" value="0">')}${fField('Próximo vencimiento',`<input type="date" name="date" required value="${now}">`)}${fField('Repetición',`<select name="repeat">${fSelect(['Mensual','Anual','Única'])}</select>`)}<div><button class="btn">Agregar compromiso</button></div></form></div><div class="panel"><h2>Fondo de ahorro familiar</h2><p>Ahorro mensual reservado: <b>${money(fam.savings)}</b></p><p class="muted">Los ahorros se muestran por separado y no se contabilizan como consumo. Para registrar un movimiento real entre cuentas, utilizá Transferencia.</p><button class="btn alt" onclick="go('familia')">Modificar ahorro mensual</button></div></div><div class="panel"><h2>Calendario de compromisos</h2><div class="scroll"><table><thead><tr><th>Concepto</th><th>Categoría</th><th>Vence</th><th>Repetición</th><th>Importe</th><th></th></tr></thead><tbody>${items.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.category)}</td><td>${esc(d.date)} ${d.date<now?'⚠️':''}</td><td>${esc(d.repeat)}</td><td>${money(d.amount)}</td><td><button class="btn alt" onclick="fRemoveDue('${d.id}')">Quitar</button></td></tr>`).join('')}</tbody></table></div><p class="muted">Los vencimientos recurrentes conservan su regla mensual o anual. Para marcar pagos efectivos, usá Movimientos; esta agenda no los descuenta automáticamente.</p></div><div class="panel"><h2>Mantenimiento del vehículo</h2><p>Kia Rio 2013 · próximo cambio de aceite: <b>${Number(v.oilLast||0)+Number(v.oilInterval||0)} km</b>${v.oilDueDate?' o '+esc(v.oilDueDate):' · fecha pendiente'}. Se debe atender lo que ocurra primero.</p></div>${fNotice}`}
function fAddDue(e){e.preventDefault();let f=new FormData(e.target);fam.due.push({id:'d'+Date.now(),name:f.get('name'),category:f.get('category'),amount:Number(f.get('amount')||0),date:f.get('date'),repeat:f.get('repeat')});fSave();render()}
function fRemoveDue(id){fam.due=fam.due.filter(x=>x.id!==id);fSave();render()}

/* Dashboards mensuales por espacio — sin alterar movimientos ni módulos existentes */
let dashMonth=new Date().toLocaleDateString('en-CA').slice(0,7);
const dPrev=m=>{let [y,mo]=m.split('-').map(Number);return new Date(y,mo-2,1).toLocaleDateString('en-CA').slice(0,7)};
const dRows=(m,sp=space)=>data.items.filter(x=>x.space===sp&&String(x.date||'').slice(0,7)===m);
const dSum=(a,type)=>a.filter(x=>x.type===type).reduce((v,x)=>v+(Number(x.amount)||0),0);
const dDiff=(now,prev)=>prev>0?`${now>=prev?'+':''}${Math.round((now-prev)/prev*100)} % frente al mes anterior`:prev===0&&now>0?'Sin base el mes anterior':'Sin variación registrada';
const dGroup=(arr,type)=>{let r={};arr.filter(x=>x.type===type).forEach(x=>{let k=String(x.category||'Sin categoría').split(' · ')[0];r[k]=(r[k]||0)+(Number(x.amount)||0)});return Object.entries(r).sort((a,b)=>b[1]-a[1])};
const dBars=(entries,total)=>entries.length?entries.slice(0,8).map(([name,v])=>`<div class="dash-bar-row"><div class="dash-bar-label"><span>${esc(name)}</span><b>${money(v)}</b></div><div class="dash-track"><div class="dash-fill" style="width:${total?Math.min(100,100*v/total):0}%"></div></div></div>`).join(''):'<div class="empty">Todavía no hay movimientos en este período.</div>';
const dHistory=(m)=>{let list=[];for(let i=5;i>=0;i--){let [y,mo]=m.split('-').map(Number);let date=new Date(y,mo-1-i,1);let key=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');let r=dRows(key);list.push({label:date.toLocaleDateString('es-PY',{month:'short'}),income:dSum(r,'Ingreso'),expense:dSum(r,'Egreso')})}return list};
const dChart=(m)=>{let a=dHistory(m),max=Math.max(1,...a.flatMap(x=>[x.income,x.expense]));return `<div class="dash-chart" role="img" aria-label="Comparación de ingresos y gastos de los últimos seis meses">${a.map(x=>`<div class="dash-col"><div class="dash-pair"><div class="dash-stick dash-in" title="Ingresos ${money(x.income)}" style="height:${Math.max(1,x.income/max*100)}%"></div><div class="dash-stick dash-out" title="Gastos ${money(x.expense)}" style="height:${Math.max(1,x.expense/max*100)}%"></div></div><small>${esc(x.label)}</small></div>`).join('')}</div><div class="dash-legend"><span><i class="dash-in"></i> Ingresos</span><span><i class="dash-out"></i> Gastos</span></div>`};
function dashboard(){let current=dRows(dashMonth),previous=dRows(dPrev(dashMonth));let inc=dSum(current,'Ingreso'),out=dSum(current,'Egreso'),prevInc=dSum(previous,'Ingreso'),prevOut=dSum(previous,'Egreso');let isPersonal=space==='personal';let top=dGroup(current,'Egreso'),prevExtras=dGroup(previous,'Egreso').find(x=>x[0]==='Extras y salidas')?.[1]||0,extras=top.find(x=>x[0]==='Extras y salidas')?.[1]||0;let planned=Number(fam.incomePlans.yo||0)+Number(fam.incomePlans.marido||0),limit=Number(fam.general)||0,saving=Number(fam.savings)||0;let latest=current.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);let net=inc-out;
let cards=`<div class="cards">${stat('Ingresos del mes',inc,dDiff(inc,prevInc),'positive')}${stat('Gastos del mes',out,dDiff(out,prevOut),'negative')}${stat('Resultado del mes',net,'Ingresos menos egresos; no equivale al saldo bancario',net>=0?'positive':'negative')}${stat('Movimientos registrados',current.length,'Incluye transferencias, que no se suman como ingreso o gasto')}</div>`;
let budget=isPersonal?`<div class="panel"><h2>Presupuesto familiar</h2><div class="dash-mini"><div><span>Ingresos previstos de ambos</span><b>${money(planned)}</b></div><div><span>Límite mensual del hogar</span><b>${limit?money(limit):'Sin definir'}</b></div><div><span>Ahorro mensual reservado</span><b>${money(saving)}</b></div><div><span>Disponible según ingresos recibidos</span><b>${money(inc-out-saving)}</b></div></div>${limit?`<p class="muted">Presupuesto utilizado: ${Math.round(out/limit*100)} %</p>${fBar(out,limit)}`:'<p class="muted">Configurá el límite familiar para comparar tus gastos con el presupuesto.</p>'}<div class="toolbar" style="margin-top:14px"><button class="btn alt" onclick="go('familia')">Presupuesto familiar</button><button class="btn alt" onclick="go('super')">Mi Súper</button></div></div>`:`<div class="panel"><h2>Resumen de BETUNCITA</h2><p>Este dashboard utiliza únicamente los movimientos registrados en el espacio Empresa. No mezcla los ingresos o gastos familiares.</p><div class="dash-mini"><div><span>Ingresos registrados</span><b>${money(inc)}</b></div><div><span>Egresos registrados</span><b>${money(out)}</b></div><div><span>Transferencias (excluidas del resultado)</span><b>${money(dSum(current,'Transferencia'))}</b></div></div><p class="muted">El resultado mostrado es de movimientos, no una utilidad contable ni un saldo bancario verificado.</p><button class="btn alt" onclick="go('reportes')">Ver reportes</button></div>`;
let savings=isPersonal?`<div class="panel"><h2>Gastos que podés revisar</h2><div class="dash-mini"><div><span>Extras y salidas este mes</span><b>${money(extras)}</b></div><div><span>Mes anterior</span><b>${money(prevExtras)}</b></div><div><span>Cambio</span><b>${dDiff(extras,prevExtras)}</b></div></div><p class="muted">Los extras se controlan sin presupuesto obligatorio. La comparación ayuda a encontrar oportunidades de ahorro.</p><button class="btn alt" onclick="go('categorias')">Ver todas las categorías</button></div>`:`<div class="panel"><h2>Accesos empresariales</h2><p>Gestioná las operaciones de BETUNCITA desde el mismo sistema.</p><div class="toolbar"><button class="btn alt" onclick="go('catalogo')">Catálogo</button><button class="btn alt" onclick="go('cotizaciones')">Cotizaciones</button><button class="btn alt" onclick="go('produccion')">Producción</button></div></div>`;
return `<div class="dash-head"><div><h2 style="margin:0 0 5px">${isPersonal?'🏠 Dashboard familiar':'🤎 Dashboard BETUNCITA'}</h2><p class="muted" style="margin:0">Indicadores calculados con movimientos registrados; cada espacio se analiza por separado.</p></div><label class="dash-month">Mes <input type="month" value="${dashMonth}" onchange="dashMonth=this.value;render()"></label></div>${cards}<div class="grid"><div class="panel"><h2>Ingresos y gastos · últimos 6 meses</h2>${dChart(dashMonth)}</div><div class="panel"><h2>Gastos por categoría · ${esc(dashMonth)}</h2>${dBars(top,out)}</div></div><div class="grid">${budget}${savings}</div><div class="panel"><h2>Últimos movimientos del mes</h2>${latest.length?table(latest):'<div class="empty">No hay movimientos registrados en el mes seleccionado.</div>'}<div class="toolbar" style="margin-top:12px"><button class="btn" onclick="go('movimientos');showForm()">+ Registrar movimiento</button><button class="btn alt" onclick="go('captura')">📷 Comprobante</button><button class="btn alt" onclick="go('voz')">🎙 Voz</button></div></div><div class="note">Los datos permanecen en este navegador. El dashboard no agrega movimientos ni altera saldos; se actualiza al registrar operaciones.</div>`;
}
const dOldRender=render;
render=function(){if(screen==='dashboard'){document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.id===space));document.getElementById('heading').textContent='Dashboard';document.getElementById('subtitle').textContent=space==='personal'?'Resumen visual de finanzas familiares':'Resumen visual de BETUNCITA';document.getElementById('view').innerHTML=dashboard();updateBrand();fNav()}else dOldRender();const nav=document.getElementById('nav');if(nav&&!nav.querySelector('[data-dash-nav]')){let b=document.createElement('button');b.className='nav'+(screen==='dashboard'?' active':'');b.dataset.dashNav='1';b.textContent='▥  Dashboard';b.onclick=()=>go('dashboard');let first=nav.querySelector('.nav');if(first)first.insertAdjacentElement('afterend',b);else nav.appendChild(b)}};

render();

</script></body></html>
